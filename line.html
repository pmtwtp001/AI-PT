<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>AI+自媒體零元創業</title>
    <!-- 每次部署請更新 LINE_GATE_VERSION（與 index.html SITE_VERSION 相同） -->
    <script>
    (function () {
        var LINE_GATE_VERSION = '20261119';
        var target = '/?v=' + encodeURIComponent(LINE_GATE_VERSION);
        try {
            var incoming = new URLSearchParams(window.location.search);
            var ref = incoming.get('ref');
            if (ref) {
                target += '&ref=' + encodeURIComponent(ref);
            }
        } catch (e) { /* ignore */ }
        window.location.replace(target);
    })();
    </script>
    <meta http-equiv="refresh" content="0;url=/?v=20261119">
</head>
<body>
    <p style="text-align:center;font-family:sans-serif;margin-top:2rem;color:#2d6a4f;">正在載入最新頁面…</p>
</body>
</html>
